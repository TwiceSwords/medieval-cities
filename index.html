<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medieval Cities</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#12140e;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  canvas{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  #hud{position:fixed;left:12px;top:12px;background:rgba(10,12,8,.75);color:#c9cdbd;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.6;border:1px solid rgba(255,255,255,.07);pointer-events:none;user-select:none}
  #hud .t{color:#e2d6a6;font-weight:600;font-size:14px}
  #hud .k{color:#8f9682}
  #top{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(10,12,8,.8);color:#d8dccb;padding:8px 10px 8px 16px;border-radius:8px;font-size:14px;border:1px solid rgba(255,255,255,.08);display:flex;gap:14px;align-items:center;user-select:none}
  button{font:inherit;font-size:13px;background:#3b3524;color:#eadfb4;border:1px solid #6b5d36;border-radius:6px;padding:5px 12px;cursor:pointer}
  button:hover:not(:disabled){background:#4a422c}button:disabled{opacity:.4;cursor:default}button.on{background:#6b5d36;color:#fff4cf}
  #teams{position:fixed;bottom:14px;right:12px;display:flex;flex-direction:column;gap:6px;user-select:none;pointer-events:none}
  .team{background:rgba(10,12,8,.82);color:#c9cdbd;padding:8px 14px;border-radius:8px;font-size:13px;border:1px solid rgba(255,255,255,.07);min-width:190px;opacity:.6;transition:opacity .3s,border-color .3s}
  .team.active{opacity:1;border-color:var(--tc)}
  .team .nm{font-weight:700;letter-spacing:1px}
  .pips{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.pip{width:10px;height:10px;border-radius:2px;border:1px solid #b2924a;background:transparent}.pip.on{background:#b2924a}.pip.half{background:linear-gradient(90deg,#96783a 50%,transparent 50%)}
  #savebar{position:fixed;left:12px;bottom:14px;display:flex;gap:6px;align-items:center;background:rgba(10,12,8,.8);padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.07);font-size:12px;user-select:none}
  #savebar .k{color:#8f9682;margin-left:4px}
  #toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(20,22,14,.92);color:#eadfb4;padding:8px 16px;border-radius:8px;border:1px solid #6b5d36;font-size:14px;opacity:0;pointer-events:none}
  #toast.show{animation:toast 2.6s ease-out}@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
  #dm{position:fixed;left:12px;top:190px;background:rgba(10,12,8,.85);color:#c9cdbd;padding:10px 12px;border-radius:8px;font-size:13px;border:1px solid #6b5d36;user-select:none;display:none;width:270px}
  #dm .t{color:#e2d6a6;font-weight:700;margin-bottom:6px}#dm .row{display:flex;gap:6px;align-items:center;margin:5px 0}#dm .lbl{width:58px;color:#8f9682}
  #dm .sub{color:#c8b98a;font-size:12px;margin-top:9px;border-top:1px solid rgba(255,255,255,.08);padding-top:7px}
  #dm input{font:inherit;font-size:13px;width:52px;background:#1d2016;color:#eadfb4;border:1px solid #6b5d36;border-radius:6px;padding:3px 6px}
  #dm table.st{border-collapse:collapse;margin-top:4px}#dm .st th{font-weight:400;color:#8f9682;font-size:11px;text-align:left;padding:0 4px}#dm .st td{padding:2px 4px 2px 0}#dm .st input{width:48px}
  #dm .st td.na{color:#5d6354;text-align:center}
  #dm .k{color:#8f9682;font-size:12px;margin-top:6px;line-height:1.5}
  #net{position:fixed;right:12px;top:12px;background:rgba(10,12,8,.8);color:#c9cdbd;padding:10px 12px;border-radius:8px;font-size:13px;border:1px solid rgba(255,255,255,.07);user-select:none}
  #net .seats{display:flex;gap:6px;margin-top:8px}
  #net .k{color:#8f9682;max-width:300px}
  #net input{font:inherit;font-size:13px;width:64px;text-transform:uppercase;letter-spacing:1px;background:#1d2016;color:#eadfb4;border:1px solid #6b5d36;border-radius:6px;padding:5px 8px}
  #top{transition:box-shadow .2s,background .2s}
  #top.pulse{animation:pulse 1.1s ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--tc);background:var(--tc)}100%{box-shadow:0 0 0 14px transparent;background:rgba(10,12,8,.8)}}
  #flash{position:fixed;top:56px;left:50%;transform:translateX(-50%);font-weight:800;font-size:20px;letter-spacing:3px;color:#fff;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none;white-space:nowrap}
  #flash.show{animation:flashin 1.6s ease-out}
  @keyframes flashin{0%{opacity:0;transform:translate(-50%,-8px) scale(1.3)}15%{opacity:1;transform:translate(-50%,0) scale(1)}70%{opacity:1}100%{opacity:0}}
  #victory{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 65%)}
  #victory.show{opacity:1}
  #victory .v1{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:min(16vw,140px);letter-spacing:.12em;color:#f3dc8e;text-shadow:0 0 30px rgba(240,200,90,.55),0 6px 0 #6b4f1c,0 10px 20px #000;transform:scale(.8);transition:transform .6s cubic-bezier(.2,1.6,.4,1)}
  #victory.show .v1{transform:scale(1)}
  #victory .v2{margin-top:8px;font-size:min(5vw,34px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 3px 10px #000}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8f9682;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="t">Medieval Cities · v0.1</div>
  <div>Hex: <span id="hov">–</span> &nbsp; Selected: <span id="sel">–</span></div>
  <div id="info" style="color:#e2d6a6"></div>
  <div class="k">Drag: pan · Wheel: zoom · Left-click: select · Esc: deselect</div>
  <div class="k">Right-click: move / attack enemy · Tab: next unit</div>
  <div class="k">Turn passes automatically · End turn / Space: end it early · R twice: new game</div>
</div>
<div id="top"><span id="turn"></span><button id="endturn" title="Space">End turn</button></div>
<div id="dm"></div>
<div id="savebar"><button id="bdm">🧙 Dungeon Master: Off</button><button id="bsave" title="Ctrl+S">💾 Save file</button><button id="bload">📂 Load file</button><input type="file" id="fload" accept=".json,application/json" hidden><span class="k">autosaves in this browser</span></div>
<div id="toast"></div>
<div id="teams"><div class="team" id="tb"></div><div class="team" id="tr"></div></div>
<div id="flash"></div>
<div id="victory"><div class="v1">VICTORY</div><div class="v2" id="vname"></div></div>
<div id="net"></div>
<div id="load">Growing grass…</div>
<script>
(() => {
  // ---------- Board settings ----------
  const COLS = 22, ROWS = 22;     // board size in hexes (pointy-top: rows run straight left-right)
  const S = 80;                   // hex radius (center to corner), px — tiles are 4x the area of before
  const U = 40;                   // unit-sized UI (rings, bars) stays the same size
  const SQ = 0.68;                // vertical squash for the angled (isometric-style) view
  const SKIRT = 14;               // thickness of the earth edge under the board
  const SQ3 = Math.sqrt(3);

  let seed = 20261113;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  // flat-top hexes, "odd-q" offset columns
  const center = (c, r) => ({ x: SQ3 * S * (c + 0.5 * (r & 1)), y: 1.5 * S * r * SQ });
  const corners = (cx, cy) => {
    const p = [];
    for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; p.push([cx + S * Math.cos(a), cy + S * Math.sin(a) * SQ]); }
    return p;
  };
  const toCube = (c, r) => { const q = c - (r - (r & 1)) / 2; return [q, r, -q - r]; };
  const hexDist = (a, b) => { const A = toCube(a[0], a[1]), B = toCube(b[0], b[1]);
    return (Math.abs(A[0] - B[0]) + Math.abs(A[1] - B[1]) + Math.abs(A[2] - B[2])) / 2; };

  // ---------- Board canvas size ----------
  const PAD = 24;
  const minX = -SQ3 / 2 * S, maxX = SQ3 * S * (COLS - 0.5) + SQ3 / 2 * S;
  const minY = -S * SQ, maxY = 1.5 * S * (ROWS - 1) * SQ + S * SQ + SKIRT;
  const BW = Math.ceil(maxX - minX + PAD * 2), BH = Math.ceil(maxY - minY + PAD * 2);
  const OX = -minX + PAD, OY = -minY + PAD;

  const hexPath = (c, r, ctx) => {
    const m = center(c, r), p = corners(m.x + OX, m.y + OY);
    ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < 6; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath();
  };

  // ---------- Value noise ----------
  function makeNoise(gs) {
    const w = Math.ceil(BW / gs) + 3, h = Math.ceil(BH / SQ / gs) + 3, g = new Float32Array(w * h);
    for (let i = 0; i < g.length; i++) g[i] = rnd();
    return (x, y) => {
      x /= gs; y /= gs; const xi = x | 0, yi = y | 0, xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = g[yi * w + xi], b = g[yi * w + xi + 1], c = g[(yi + 1) * w + xi], d = g[(yi + 1) * w + xi + 1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }

  // ---------- Grass texture (muted, darker) ----------
  function makeGrass() {
    const cv = document.createElement('canvas'); cv.width = BW; cv.height = BH;
    const g = cv.getContext('2d'), img = g.createImageData(BW, BH), d = img.data;
    const nBig = makeNoise(220), nMid = makeNoise(70), nFine = makeNoise(16), nDry = makeNoise(160), nDirt = makeNoise(110);
    for (let y = 0; y < BH; y++) {
      const wy = y / SQ; // un-squash so patches look like they lie flat on the ground
      for (let x = 0; x < BW; x++) {
        const n = 0.5 * nBig(x, wy) + 0.32 * nMid(x, wy) + 0.18 * nFine(x, wy);
        const grain = (rnd() - 0.5) * 0.09;
        const l = 1.13 + 0.5 * (n - 0.5) * 1.6 + grain;
        let r = 40 * l, gg = 56 * l, b = 30 * l;
        const dry = Math.max(0, nDry(x, wy) - 0.55) * 2.2;       // yellowish dry patches
        r += 16 * dry; gg += 6 * dry; b += 2 * dry;
        const dirt = Math.max(0, 0.3 - nDirt(x, wy)) * 3.2;      // faint worn earth
        r = r + (52 - r) * dirt * 0.55; gg = gg + (44 - gg) * dirt * 0.55; b = b + (32 - b) * dirt * 0.55;
        const i = (y * BW + x) * 4; d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);

    // grass blades, batched by colour
    const buckets = ['rgba(24,34,18,0.45)', 'rgba(30,42,22,0.4)', 'rgba(58,74,40,0.35)', 'rgba(66,80,44,0.3)', 'rgba(74,76,46,0.28)', 'rgba(20,28,15,0.5)'];
    const blades = Math.floor(BW * BH / 34);
    g.lineCap = 'round';
    for (const col of buckets) {
      g.beginPath();
      for (let i = 0; i < blades / buckets.length; i++) {
        const x = rnd() * BW, y = rnd() * BH, len = 2.5 + rnd() * 5, a = -Math.PI / 2 + (rnd() - 0.5) * 0.9;
        g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      }
      g.strokeStyle = col; g.lineWidth = 1; g.stroke();
    }
    // a few small stones
    for (let i = 0; i < BW * BH / 9000; i++) {
      const x = rnd() * BW, y = rnd() * BH, s = 1.2 + rnd() * 2.2;
      g.fillStyle = 'rgba(20,20,16,0.5)'; g.beginPath(); g.ellipse(x + 0.8, y + 0.8, s, s * SQ, 0, 0, 7); g.fill();
      g.fillStyle = `rgba(${95 + rnd() * 20},${92 + rnd() * 15},${80},0.75)`; g.beginPath(); g.ellipse(x, y, s, s * SQ, 0, 0, 7); g.fill();
    }
    return cv;
  }

  // ---------- Pre-rendered layers ----------
  let boardCv, gridCv;
  function buildLayers() {
    boardCv = document.createElement('canvas'); boardCv.width = BW; boardCv.height = BH;
    const b = boardCv.getContext('2d');

    // earth skirt (board thickness)
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
      const m = center(c, r), p = corners(m.x + OX, m.y + OY);
      b.beginPath(); b.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i <= 2; i++) b.lineTo(p[i][0], p[i][1]);
      for (let i = 2; i >= 0; i--) b.lineTo(p[i][0], p[i][1] + SKIRT);
      b.closePath();
      const gr = b.createLinearGradient(0, m.y + OY, 0, m.y + OY + S * SQ + SKIRT);
      gr.addColorStop(0, '#2c2318'); gr.addColorStop(1, '#16110b');
      b.fillStyle = gr; b.fill();
    }

    // grass top clipped to the board shape
    const grass = makeGrass();
    b.save(); b.beginPath();
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) hexPath(c, r, b);
    b.clip(); b.drawImage(grass, 0, 0);
    const vg = b.createRadialGradient(BW / 2, BH / 2, Math.min(BW, BH) * 0.25, BW / 2, BH / 2, Math.max(BW, BH) * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
    b.fillStyle = vg; b.fillRect(0, 0, BW, BH);
    b.restore();

    // grid lines on their own layer
    gridCv = document.createElement('canvas'); gridCv.width = BW; gridCv.height = BH;
    const gc = gridCv.getContext('2d');
    gc.beginPath(); for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) hexPath(c, r, gc);
    gc.lineJoin = 'round'; gc.strokeStyle = 'rgba(8,12,5,0.78)'; gc.lineWidth = 2.4; gc.stroke();
    gc.strokeStyle = 'rgba(190,200,150,0.13)'; gc.lineWidth = 0.8; gc.translate(0, 1.6); gc.stroke();
  }

  // ---------- Mini 3D renderer (flat-shaded low-poly, no libraries) ----------
  // Model space: y up, +z = forward (toward viewer at facing 0), figure's right hand = -x.
  const CE = Math.sqrt(1 - SQ * SQ);           // cos of camera elevation (heights are drawn shorter by this)
  const K = 4.6;                               // model units -> board pixels
  const LIGHT = (() => { const l = [-0.55, 0.75, 0.45], n = Math.hypot(...l); return l.map(x => x / n); })();

  function rot(p, [rx, ry, rz]) {
    let [x, y, w] = p, c, s;
    if (rx) { c = Math.cos(rx); s = Math.sin(rx); [y, w] = [y * c - w * s, y * s + w * c]; }
    if (rz) { c = Math.cos(rz); s = Math.sin(rz); [x, y] = [x * c - y * s, x * s + y * c]; }
    if (ry) { c = Math.cos(ry); s = Math.sin(ry); [x, w] = [x * c + w * s, -x * s + w * c]; }
    return [x, y, w];
  }
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

  function boxG(w, h, d, tx = 1, tz = 1) {
    const v = [[-w/2,0,-d/2],[w/2,0,-d/2],[w/2,0,d/2],[-w/2,0,d/2],
               [-w*tx/2,h,-d*tz/2],[w*tx/2,h,-d*tz/2],[w*tx/2,h,d*tz/2],[-w*tx/2,h,d*tz/2]];
    return { v, f: [[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]] };
  }
  function cylG(r, h, n, rTop = r) {
    const v = [], f = [], bot = [], top = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; v.push([Math.cos(a) * r, 0, Math.sin(a) * r]); }
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; v.push([Math.cos(a) * rTop, h, Math.sin(a) * rTop]); }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; f.push([i, j, n + j, n + i]); bot.push(i); top.push(n + i); }
    f.push(bot, top); return { v, f };
  }
  function part(mesh, g, col, { o = [0,0,0], r = [0,0,0], p = [0,0,0], bias = 0 } = {}) {
    const base = mesh.v.length, tv = g.v.map(q => add(rot(add(q, o), r), p));
    const cen = tv.reduce((a, q) => add(a, q), [0,0,0]).map(x => x / tv.length);
    mesh.v.push(...tv, cen);
    for (const f of g.f) mesh.f.push({ i: f.map(k => k + base), col, c: base + tv.length, b: bias });   // bias: draw on top of what it sits on
  }
  const tip = (p, r, len) => add(p, rot([0, -len, 0], r));

  function buildSwordsman(team) {
    const m = { v: [], f: [] };
    const STEEL = [150,155,162], MAIL = [112,116,122], LEATHER = [86,60,38], DARK = [48,34,22],
          CLOTH = [72,60,46], SKIN = [196,156,124], WOOD = [96,66,40];
    // legs & boots
    for (const sx of [-1, 1]) {
      part(m, boxG(1.4, 2.1, 2.3), DARK, { p: [sx * 0.95, 0, 0.25] });
      part(m, boxG(1.25, 6.2, 1.35), CLOTH, { p: [sx * 0.95, 1.9, 0] });
    }
    // mail skirt, torso, belt, tabard
    part(m, boxG(4.0, 3.2, 2.6, 0.95, 0.95), MAIL, { p: [0, 6.3, 0] });
    part(m, boxG(3.9, 5.0, 2.4, 1.12, 1.0), MAIL, { p: [0, 9.2, 0] });
    part(m, boxG(4.25, 0.7, 2.75), LEATHER, { p: [0, 9.1, 0] });
    part(m, boxG(2.8, 6.6, 0.18, 1.05), team, { p: [0, 6.9, 1.27] });
    part(m, boxG(2.8, 6.6, 0.18, 1.05), team, { p: [0, 6.9, -1.27] });
    // neck, head, helmet with nasal guard
    part(m, boxG(1.0, 0.8, 1.0), SKIN, { p: [0, 14.1, 0] });
    part(m, boxG(1.6, 2.0, 1.75), SKIN, { p: [0, 14.6, 0.05] });
    part(m, cylG(1.08, 1.25, 10, 1.0), STEEL, { p: [0, 15.55, 0.05] });
    part(m, cylG(1.0, 0.9, 10, 0.12), STEEL, { p: [0, 16.8, 0.05] });
    part(m, boxG(0.28, 1.3, 0.2), STEEL, { p: [0, 14.8, 0.98] });
    // shoulder guards
    for (const sx of [-1, 1]) part(m, boxG(1.5, 1.3, 2.6, 0.85, 0.9), LEATHER, { p: [sx * 2.25, 13.0, 0] });

    // right arm (screen-left at facing 0) raising the sword
    const rS = [-2.35, 13.4, 0.1], rU = [-0.35, 0, 0.12], rE = tip(rS, rU, 3.6), rF = [-1.35, 0, 0.05], rH = tip(rE, rF, 3.0);
    part(m, boxG(1.15, 3.6, 1.2), MAIL, { o: [0, -3.6, 0], r: rU, p: rS });
    part(m, boxG(1.05, 3.0, 1.05), LEATHER, { o: [0, -3.0, 0], r: rF, p: rE });
    part(m, boxG(1.1, 1.0, 1.1), DARK, { o: [0, -0.5, 0], r: rF, p: rH });
    const sw = [0.45, 0, 0];
    part(m, boxG(0.32, 1.6, 0.32), DARK, { o: [0, -0.8, 0], r: sw, p: rH });
    part(m, boxG(0.6, 0.45, 0.6), STEEL, { o: [0, -1.25, 0], r: sw, p: rH });
    part(m, boxG(2.0, 0.32, 0.45), STEEL, { o: [0, 0.8, 0], r: sw, p: rH });
    part(m, boxG(0.42, 7.2, 0.13, 0.25), [190,195,202], { o: [0, 1.1, 0], r: sw, p: rH });

    // left arm (screen-right) bracing the shield
    const lS = [2.35, 13.4, 0.1], lU = [-0.3, 0, -0.1], lE = tip(lS, lU, 3.5), lF = [-1.5, 0, 0], lH = tip(lE, lF, 2.3);
    part(m, boxG(1.15, 3.5, 1.2), MAIL, { o: [0, -3.5, 0], r: lU, p: lS });
    part(m, boxG(1.05, 2.3, 1.05), LEATHER, { o: [0, -2.3, 0], r: lF, p: lE });
    // round shield: wooden rim, painted face, steel boss
    const sh = [Math.PI / 2, 0.32, 0], sp = [lH[0] - 0.4, lH[1] + 0.9, lH[2] + 0.35];
    part(m, cylG(3.05, 0.4, 16), WOOD, { r: sh, p: sp });
    part(m, cylG(2.65, 0.1, 16), team, { r: sh, p: add(sp, rot([0, 0.4, 0], sh)) });

  // extruded flat shape (e.g. a kite shield): outline in x/y, thickness along z
  function prismG(pts, d) {

    for (let i = 0; i < n; i++) { const j = (i + 1) % n; f.push([i, j, n + j, n + i]); }

  // draw a mesh at board position (bx,by) facing angle th (radians, 0 = toward viewer)
  function drawMesh(g, mesh, bx, by, th, t, flash = 0) {

      const a = P[f.i[0]], b = P[f.i[1]], d = P[f.i[2]];

      if (n[1] * SQ + n[2] * CE <= 0.01) continue;            // facing away from camera
      const lit = 0.42 + 0.7 * Math.max(0, n[0]*LIGHT[0] + n[1]*LIGHT[1] + n[2]*LIGHT[2]);
      faces.push({ f, depth: fc[2] * CE + fc[1] * SQ + f.b, lit });
    }
    faces.sort((p, q) => p.depth - q.depth);
    g.lineJoin = 'round'; g.lineWidth = 0.5;
    for (const { f, lit } of faces) {
      g.beginPath();
      f.i.forEach((k, j) => { const [x, y, w] = P[k]; const sx = bx + x * K, sy = by + (w * SQ - y * CE) * K; j ? g.lineTo(sx, sy) : g.moveTo(sx, sy); });
      g.closePath();
      const fl = flash * 0.65, cr = f.col[0] * lit * (1 - fl) + 255 * fl, cg = f.col[1] * lit * (1 - fl) + 70 * fl, cb = f.col[2] * lit * (1 - fl) + 55 * fl;

  // ---------- Units & game state ----------
  const TEAM = { blue: [52, 86, 146], red: [152, 30, 42] };

    { id: 'r1', col: 14, row: 8, team: 'red' }, { id: 'r2', col: 14, row: 11, team: 'red' }, { id: 'r3', col: 14, row: 14, team: 'red' },

  function runtimeUnit(s) {

      types: game.types, units: START.map(s => ({ ...s, type: 'swordsman', hp: typeMax('swordsman'), maxHp: typeMax('swordsman'), sta: typeStat('swordsman', 'staMax'), staMax: typeStat('swordsman', 'staMax'), mana: typeStat('swordsman', 'manaMax'), manaMax: typeStat('swordsman', 'manaMax'), face: s.team === 'blue' ? Math.PI / 2 : -Math.PI / 2, moved: false, attacked: false })) };
  }

      units: units.filter(u => u.dying === null && u.hp > 0).map(u => ({ id: u.id, type: u.type, team: u.team, col: u.col, row: u.row, hp: u.hp, maxHp: u.maxHp, sta: u.sta, staMax: u.staMax, mana: u.mana, manaMax: u.manaMax,
        face: Math.round(u.want * 100) / 100, moved: u.moved, attacked: u.attacked })) };

  function applyState(st) {                       // snap to a shared state (keeps smooth facing/HP bars)
    const old = new Map(units.map(u => [u.id, u]));
    units = st.units.map(s => { const o = old.get(s.id);
      if (!o) return runtimeUnit(s);
      if (typeof s.face === 'number') o.want = s.face;          // keep facing in sync with the shared game
      Object.assign(o, { col: s.col, row: s.row, hp: s.hp, maxHp: s.maxHp || o.maxHp, sta: s.sta ?? o.sta, staMax: s.staMax ?? o.staMax, mana: s.mana ?? o.mana, manaMax: s.manaMax ?? o.manaMax, moved: s.moved, attacked: s.attacked, path: null, atk: null, dying: null, dragPos: null });
      return o; });

  // ---------- Saving: autosave in this browser + save/load files ----------
  const SAVE_KEY = 'medieval-cities-save-v1';
  function saveLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, savedAt: Date.now(), g: exportState(null) })); } catch (e) {} }
  function validState(st) {
    return st && typeof st.seq === 'number' && (st.turn === 'blue' || st.turn === 'red') && Array.isArray(st.units) &&
      st.units.every(u => u && typeof u.id === 'string' && TEAM[u.team] && (u.type === undefined || UNIT_TYPES[u.type]) && Number.isInteger(u.col) && Number.isInteger(u.row) &&
        u.col >= 0 && u.col < COLS && u.row >= 0 && u.row < ROWS && typeof u.hp === 'number');
  }
  function loadLocal() {
    try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (d && validState(d.g)) { applyState(d.g); return true; } } catch (e) {}
    return false;
  }
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }
  function saveFile() {
    const blob = new Blob([JSON.stringify({ v: 1, savedAt: new Date().toISOString(), g: exportState(null) }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'), d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `medieval-cities-round${game.round}-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Saved to your Downloads folder');

  function loadFile(file) {
    if (busy()) { toast('Wait for the current move to finish'); return; }
    if (mode === 'online' && mySeat !== 'blue') { toast('Only the host can load a save'); return; }
    file.text().then(txt => {
      let d; try { d = JSON.parse(txt); } catch (e) { toast('That is not a Medieval Cities save file'); return; }
      const st = d && d.g; if (!validState(st)) { toast('That is not a Medieval Cities save file'); return; }
      const loaded = { ...st, seq: game.seq + 1, last: { type: 'load', seq: game.seq + 1 } };

      toast(`Loaded save · Round ${loaded.round}`);
    });
  }
  const unitAt = h => h && units.find(u => u.col === h[0] && u.row === h[1]);
  const busy = () => !!afterIdle || units.some(u => u.path || u.atk || u.dying !== null);
  const faceToward = (u, o) => { const a = center(u.col, u.row), b = center(o.col, o.row); u.want = Math.atan2(b.x - a.x, (b.y - a.y) / SQ); };
  const winner = () => { if (game.dm && !game.battle) return null; const t = new Set(units.filter(u => u.dying === null).map(u => u.team)); return t.size === 1 ? [...t][0] : null; };

  // hex neighbours & pathfinding (odd-q offset <-> axial)
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const toAx = (c, r) => [c - (r - (r & 1)) / 2, r], fromAx = (q, r) => [q + (r - (r & 1)) / 2, r];
  const key = (c, r) => c + ',' + r;

    return DIRS.map(([dq, dr]) => fromAx(q + dq, rr + dr)).filter(([a, b]) => a >= 0 && a < COLS && b >= 0 && b < ROWS); };
  function reach(u) {

  function pathTo(b, h) { const p = []; let cur = h; while (b.prev.has(key(...cur))) { p.unshift(cur); cur = b.prev.get(key(...cur)); } return p; }

  function upos(u) {
    if (u.dragPos) return u.dragPos;
    const a = center(u.col, u.row); let x = a.x, y = a.y;
    if (u.path) { const b = center(...u.path[0]), e = u.segT * u.segT * (3 - 2 * u.segT); x += (b.x - x) * e; y += (b.y - y) * e; }

  // play one action (used for your own clicks AND to replay the other player's), then call done when idle
  function play(a, done) {
    const u = units.find(x => x.id === a.id);
    if (a.type === 'end' || a.type === 'reset' || !u) { done(); return; }
    const tgt = a.target && units.find(x => x.id === a.target);
    const strike = () => { if (tgt && tgt.hp > 0) { attack(u, tgt); u.attacked = true; u.moved = true; } };
    if (a.path && a.path.length) u.moved = true;

  function updateUnits(dt) {

      const pips = alive.map(u => `<span class="pip ${!active ? 'on' : unitDone(u) ? '' : u.moved ? 'half' : 'on'}"></span>`).join('');
      const you = mode === 'online' && mySeat === team ? ' (you)' : '';
      const html = `<span class="nm" style="color:rgb(${TEAM[team].map(v => v + 80)})">${teamName(team)}${you}</span> · ` +
        (active ? `${left}/${alive.length} units left to act` : `${alive.length} unit${alive.length === 1 ? '' : 's'} · waiting`) + `<span class="pips">${pips}</span>`;
      if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; }
      el.classList.toggle('active', active); el.style.setProperty('--tc', `rgb(${TEAM[team].map(v => v + 60)})`);
    }
    endBtn.disabled = !!w || !myTurn() || busy() || endLocked();
    // turn change flash
    if (!w && game.turn !== seenTurn) {
      seenTurn = game.turn; turnStartedAt = Date.now(); const c = `rgb(${TEAM[game.turn].map(v => v + 40)})`;
      topEl.style.setProperty('--tc', c); topEl.classList.remove('pulse'); void topEl.offsetWidth; topEl.classList.add('pulse');
      flashEl.style.color = `rgb(${TEAM[game.turn].map(v => v + 90)})`;
      flashEl.textContent = mode === 'online' ? (myTurn() ? 'YOUR TURN' : `${poss(teamName(game.turn)).toUpperCase()} TURN`) : `${poss(teamName(game.turn)).toUpperCase()} TURN`;
      flashEl.classList.remove('show'); void flashEl.offsetWidth; flashEl.classList.add('show');
    }
    // big victory banner for 4 seconds
    if (w !== seenWinner) {
      seenWinner = w; clearTimeout(vicTimer);
      if (w) {
        const n = document.getElementById('vname');
        n.textContent = mode === 'online' ? `${teamName(w)} wins${w === mySeat ? ' · you' : ''}` : `${teamName(w)} wins`;
        n.style.color = `rgb(${TEAM[w].map(v => v + 80)})`;
        vicEl.classList.add('show'); vicTimer = setTimeout(() => vicEl.classList.remove('show'), 4000);
      } else { vicEl.classList.remove('show'); seenTurn = game.turn; }
    }
    if (!room) {                                           // direct-connection panel
      let html;
      if (p2p.conn) html = `<div>🟢 Connected to your friend · you are <b style="color:rgb(${TEAM[mySeat].map(c => c + 70)})">${teamName(mySeat)}</b></div>
        <div class="seats"><button data-act="leave">Disconnect</button></div>`;
      else if (p2p.role === 'host') html = `<div>Game code: <b style="font-size:17px;letter-spacing:2px;color:#f0e2a8">${p2p.ready ? p2p.code : '·····'}</b></div>
        <div class="k">${p2p.status}</div><div class="seats"><button data-act="leave">Cancel</button></div>`;
      else html = `<div>Play with a friend (direct connection)</div>
        <div class="seats"><button data-act="host">Host game</button>
        <input id="code" maxlength="5" placeholder="CODE" autocomplete="off"><button data-act="join">Join</button></div>
        ${p2p.status ? `<div class="k" style="margin-top:6px">${p2p.status}</div>` : ''}`;
      if (lastNetHtml !== html) {
        const old = document.getElementById('code'), v = old ? old.value : '';
        lastNetHtml = html; netEl.innerHTML = html;
        const inp = document.getElementById('code'); if (inp) inp.value = v;
      }
      return;
    }
    const others = peerList.filter(p => !p.sameTab && p.kind === 'viewer').length, taken = seatsTaken();
    const conn = room.connected();
    const btn = (id, label, dis) => `<button data-seat="${id}" ${dis ? 'disabled' : ''} class="${(mode === 'local' && id === 'local') || (mode === 'online' && mySeat === id) ? 'on' : ''}">${label}</button>`;
    const netHtml = `<div>${conn ? '🟢 Online' : '⚪ Connecting…'} · ${others} other player${others === 1 ? '' : 's'} here</div>
      <div class="seats">${btn('blue', 'Play Blue', taken.blue)}${btn('red', 'Play Red', taken.red)}${btn('local', 'Local (both)', false)}</div>`;
    if (lastNetHtml !== netHtml) { lastNetHtml = netHtml; netEl.innerHTML = netHtml; }
  }
  document.getElementById('net').addEventListener('click', e => {
    const act = e.target.closest('button[data-act]');
    if (act) {
      if (act.dataset.act === 'host') p2pHost();
      if (act.dataset.act === 'join') p2pJoin(document.getElementById('code').value);
      if (act.dataset.act === 'leave') p2pStop('');
      return;
    }
    const s = e.target.closest('button[data-seat]'); if (!s || s.disabled) return;
    if (s.dataset.seat === 'local') { mode = 'local'; mySeat = null; } else { mode = 'online'; mySeat = s.dataset.seat; }
    selUnit = null; sel = null; publish(null); refreshUI();
  });

  let turnStartedAt = 0;                                    // End turn is locked for 1 s after every turn change
  const endLocked = () => Date.now() - turnStartedAt < 1000;
  function endTurn() { if (winner() || !myTurn() || busy() || endLocked()) return; commit({ type: 'end' }); }
  const endBtn = document.getElementById('endturn');
  endBtn.addEventListener('click', endTurn);
  document.getElementById('bsave').addEventListener('click', saveFile);
  document.getElementById('bdm').addEventListener('click', toggleDM);
  document.getElementById('dm').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.place) { const [type, team] = b.dataset.place.split(':'); placing = placing && placing.type === type && placing.team === team ? null : { type, team }; selUnit = null; sel = null; }
    if (b.dataset.act === 'remove') removeSelected();
    if (b.dataset.act === 'heal') healHeroes();
    refreshUI();
  });
  document.getElementById('dm').addEventListener('change', e => {
    const i = e.target; if (i.tagName !== 'INPUT' || !dmActive() || busy()) return;
    const k = i.dataset.unit;
    if (i.dataset.type) { if (i.dataset.stat) setTypeStat(i.dataset.type, i.dataset.stat, i.value); else setTypeMax(i.dataset.type, i.value); }
    else if (k && selUnit) {
      if (k === 'max') setUnitMax(selUnit, i.value); else if (k === 'hp') selUnit.hp = Math.min(selUnit.maxHp, clampHp(i.value));
      else if (k === 'sta' || k === 'staMax') setUnitRes(selUnit, 'sta', 'staMax', i.value, k === 'staMax');
      else if (k === 'mana' || k === 'manaMax') setUnitRes(selUnit, 'mana', 'manaMax', i.value, k === 'manaMax');
    }
    else return;
    commit({ type: 'edit' });
  });
  document.getElementById('bload').addEventListener('click', () => document.getElementById('fload').click());
  document.getElementById('fload').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
  function resetGame() {
    if (Date.now() - resetArmed > 2000) { resetArmed = Date.now(); turnEl.innerHTML = 'Press <b>R</b> again to reset the game for everyone'; lastTurnHtml = ''; return; }
    resetArmed = 0; const st = freshState(game.seq + 1); st.last = { type: 'reset', seq: st.seq };
    floats = []; applyState(st); publish(st.last);
  }

  // ---------- Input ----------
  let down = null, dragging = false;
  cv.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const h = pick(e.clientX, e.clientY), u = unitAt(h);
    down = { x: e.clientX, y: e.clientY, ox: off.x, oy: off.y, grab: dmActive() && !placing && u && !busy() ? u : null };
    dragging = false; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (down) {
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!dragging && Math.hypot(dx, dy) > 4) { dragging = true; cv.classList.add('drag'); if (down.grab) dragUnit = down.grab; }
      if (dragging && dragUnit) dragUnit.dragPos = { x: (e.clientX - off.x) / z, y: (e.clientY - off.y) / z + 10 };
      else if (dragging) { off.x = down.ox + dx; off.y = down.oy + dy; }
    }
    const h = pick(e.clientX, e.clientY);
    if (fmt(h) !== fmt(hover)) { hover = h; hovEl.textContent = fmt(h); }
  });
  cv.addEventListener('pointerup', e => {
    const h = pick(e.clientX, e.clientY);
    if (dragUnit) {                                          // DM: drop the dragged unit
      const u = dragUnit; dragUnit = null; u.dragPos = null;
      const o = unitAt(h);
      if (h && (!o || o === u) && dmActive()) { [u.col, u.row] = h; selUnit = u; sel = h; commit({ type: 'edit' }); }
      else if (h) toast('That tile is taken');
    } else if (down && !dragging) {
      if (placing && dmActive()) {                         // DM: place a new unit
        if (h && !unitAt(h)) {
          const T = UNIT_TYPES[placing.type];
          units.push(runtimeUnit({ id: placing.type[0] + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), type: placing.type,
            team: placing.team, col: h[0], row: h[1], hp: typeMax(placing.type), maxHp: typeMax(placing.type), sta: typeStat(placing.type, 'staMax'), staMax: typeStat(placing.type, 'staMax'), mana: typeStat(placing.type, 'manaMax'), manaMax: typeStat(placing.type, 'manaMax'), face: placing.team === 'blue' ? Math.PI / 2 : -Math.PI / 2, moved: false, attacked: false }));
          commit({ type: 'edit' });
        } else if (h) toast('That tile is taken');
      } else {
        sel = (h && sel && h[0] === sel[0] && h[1] === sel[1]) ? null : h;
        selUnit = unitAt(sel) || null; refreshUI();
      }
    }
    down = null; dragging = false; cv.classList.remove('drag');
  });
  cv.addEventListener('pointerleave', () => { if (!down && hover) { hover = null; hovEl.textContent = '–'; } });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const nz = Math.min(3, Math.max(0.18, z * Math.exp(-e.deltaY * 0.0015)));
    off.x = e.clientX - (e.clientX - off.x) * (nz / z); off.y = e.clientY - (e.clientY - off.y) * (nz / z);
    z = nz;
  }, { passive: false });

  // hotkeys: work the same for every player on their own PC
  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') { if (e.target.id === 'code') p2pJoin(e.target.value); else e.target.blur(); } return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); return; }
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'r') resetGame();
    if (k === 'escape') { if (placing) { placing = null; refreshUI(); return; } sel = null; selUnit = null; refreshUI(); }
    if (k === 'delete' || k === 'backspace') removeUnit(unitAt(hover) || selUnit);   // DM: delete the unit under the mouse
    if (k === ' ') { e.preventDefault(); endTurn(); }
    if (k === 'tab') {                                       // cycle through your units that can still act
      e.preventDefault();
      const mine = units.filter(canCommand); if (!mine.length) return;
      selUnit = mine[(mine.indexOf(selUnit) + 1) % mine.length]; sel = [selUnit.col, selUnit.row];
      const m = center(...sel); off.x = innerWidth / 2 - (m.x + OX) * z; off.y = innerHeight / 2 - (m.y + OY) * z; refreshUI();
    }
  });
  addEventListener('contextmenu', e => e.preventDefault());   // no browser menu inside the game
  cv.addEventListener('contextmenu', e => {
    if (!selUnit || busy()) return;
    const h = pick(e.clientX, e.clientY); if (!h) return;
    const u = selUnit, tgt = unitAt(h), here = [u.col, u.row];
    const hint = (txt, hh) => { const m = center(...hh); addFloat(m.x + OX, m.y + OY - 20, txt, '#cfc9b4', 14); };
    if (!canCommand(u)) { hint(winner() ? 'Game over' : u.team !== game.turn || !myTurn() ? 'Not your turn' : 'Already acted', here); return; }
    if (tgt === u) return;
    if (tgt) {
      if (tgt.team === u.team || tgt.dying !== null) return;
      if (u.attacked) { hint('Already attacked', here); return; }
      let path = [];
      if (hexDist(here, h) !== 1) {
        if (u.moved) { hint('Already moved', here); return; }
        const b = reach(u); let best = null;
        for (const n of neighbors(...h)) { const d = b.dist.get(key(...n)); if (d != null && d > 0 && !unitAt(n) && (!best || d < best.d)) best = { n, d }; }
        if (!best) { hint('Out of reach', h); return; }
        path = pathTo(b, best.n);
      }
      const a = { type: 'attack', id: u.id, path, target: tgt.id };
      play(a, () => commit(a)); return;
    }
    if (u.moved) { hint('Already moved', here); return; }
    const b = reach(u);
    if (!b.dist.has(key(...h))) { hint('Too far', h); return; }
    const a = { type: 'move', id: u.id, path: pathTo(b, h) };
    play(a, () => commit(a));
  });
  addEventListener('resize', () => resize(false));

  // ---------- Start ----------
  if (loadLocal()) setTimeout(() => toast(`Continuing your saved game · Round ${game.round}`), 600); else applyState(freshState(0));
  setInterval(() => { if (lastRemote && !busy()) { const st = lastRemote; lastRemote = null; onRemoteState(st); } refreshUI(); }, 250);
  setTimeout(() => {
    buildLayers();
    document.getElementById('load').remove();
    resize(true);
    loop();
    connect();
  }, 30);
})();
</script>
</body>
</html>
